<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a1122" />
    </linearGradient>

    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Animated Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      .pulse-orb {
        animation: floatPulse 6s ease-in-out infinite alternate;
      }
      .pulse-orb-2 {
        animation: floatPulse2 8s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8 12;
        animation: dashFlow 20s linear infinite;
      }
      .particle {
        animation: drift 10s ease-in-out infinite alternate;
      }
      @keyframes floatPulse {
        0% { transform: translateY(0px) scale(1); opacity: 0.35; }
        100% { transform: translateY(-25px) scale(1.15); opacity: 0.7; }
      }
      @keyframes floatPulse2 {
        0% { transform: translateY(0px) scale(1.1); opacity: 0.3; }
        100% { transform: translateY(30px) scale(0.95); opacity: 0.65; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -400; }
      }
      @keyframes drift {
        0% { transform: translate(0, 0); }
        50% { transform: translate(15px, -15px); }
        100% { transform: translate(-10px, 10px); }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="20" fill="url(#grid)" />
  <rect width="1196" height="416" x="2" y="2" rx="18" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g filter="url(#glow)">
    <circle class="pulse-orb" cx="180" cy="120" r="90" fill="#0284c7" />
    <circle class="pulse-orb-2" cx="1020" cy="300" r="110" fill="#6366f1" />
    <circle class="pulse-orb" cx="940" cy="90" r="75" fill="#a855f7" />
    <circle class="pulse-orb-2" cx="260" cy="330" r="80" fill="#10b981" opacity="0.4" />
  </g>

  <!-- Flowing Network Curves in Background -->
  <g fill="none" stroke-width="2" opacity="0.45">
    <path class="flow-line" stroke="#38bdf8" d="M -50 200 Q 300 80 600 220 T 1250 180" />
    <path class="flow-line" stroke="#818cf8" d="M -50 280 Q 400 360 800 210 T 1250 300" />
    <path class="flow-line" stroke="#c084fc" d="M -50 140 Q 500 40 900 170 T 1250 120" />
  </g>

  <!-- Floating Ambient Particles -->
  <g class="particle" opacity="0.75">
    <circle cx="140" cy="80" r="3" fill="#38bdf8" />
    <circle cx="320" cy="70" r="2" fill="#818cf8" />
    <circle cx="520" cy="95" r="3.5" fill="#c084fc" />
    <circle cx="750" cy="65" r="2.5" fill="#38bdf8" />
    <circle cx="1060" cy="160" r="3" fill="#fbbf24" />
    <circle cx="1120" cy="240" r="2" fill="#818cf8" />
  </g>

  <!-- Main Content in Crisp Foreground -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(445, 45)">
      <rect width="310" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1.2" />
      <circle cx="22" cy="18" r="6" fill="#10b981" />
      <circle cx="22" cy="18" r="9" fill="#10b981" fill-opacity="0.2" />
      <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="1.2">CURATED IMPACT REPOSITORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad1)" letter-spacing="-0.5">
      Awesome Corporate Philanthropy
    </text>

    <!-- Title Part 2 / Sub-header -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="0.2">
      &amp; Social Impact Platforms
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      A definitive guide to enterprise CSR SaaS ecosystems, workplace giving &amp; open-source civic tech
    </text>

    <!-- Feature Pillars (Cards / Pills) -->
    <g transform="translate(150, 280)">
      <!-- Card 1: Workplace Giving -->
      <g transform="translate(0, 0)">
        <rect width="200" height="80" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <rect width="200" height="3" x="0" y="0" rx="1.5" fill="#38bdf8" />
        <text x="100" y="35" text-anchor="middle" font-size="20">🤝</text>
        <text x="100" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Workplace Giving</text>
      </g>

      <!-- Card 2: Volunteer Management -->
      <g transform="translate(235, 0)">
        <rect width="200" height="80" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <rect width="200" height="3" x="0" y="0" rx="1.5" fill="#818cf8" />
        <text x="100" y="35" text-anchor="middle" font-size="20">🙋</text>
        <text x="100" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Volunteering</text>
      </g>

      <!-- Card 3: Grantmaking -->
      <g transform="translate(470, 0)">
        <rect width="200" height="80" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <rect width="200" height="3" x="0" y="0" rx="1.5" fill="#c084fc" />
        <text x="100" y="35" text-anchor="middle" font-size="20">📜</text>
        <text x="100" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Grant Lifecycle</text>
      </g>

      <!-- Card 4: Open Infrastructure -->
      <g transform="translate(705, 0)">
        <rect width="200" height="80" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
        <rect width="200" height="3" x="0" y="0" rx="1.5" fill="#34d399" />
        <text x="100" y="35" text-anchor="middle" font-size="20">🌱</text>
        <text x="100" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Open-Source Tech</text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(0, 392)">
      <line x1="40" y1="0" x2="1160" y2="0" stroke="#1e293b" stroke-width="1" />
      <text x="600" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">
        Enterprise Market Benchmarks • Transparent Pricing • Verified Community Repositories
      </text>
    </g>
  </g>
</svg>